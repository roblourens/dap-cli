<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TypeScript Button Demo</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; padding: 2rem; }
    button { font-size: 1rem; padding: 0.5rem 1rem; }
    #result { margin-top: 1rem; font-family: monospace; }
  </style>
</head>
<body>
  <h1>TypeScript Button Demo</h1>
  <p>Click the button. dap-cli should pause inside <code>handleClick</code> in <code>app.ts</code> (source-mapped from <code>dist/app.js</code>).</p>
  <button id="go" data-count="0">Go</button>
  <p id="result">waiting</p>
  <script src="dist/app.js"></script>
</body>
</html>
